# Intégration continue : compilation et tests sur chaque push et pull request.
name: Intégration continue

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  serveur:
    name: Serveur .NET (compilation et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore PilotageForfaits.sln
      - run: dotnet build PilotageForfaits.sln --no-restore --configuration Release
      - run: dotnet test PilotageForfaits.sln --no-build --configuration Release --logger "trx;LogFileName=resultats.trx" --results-directory resultats-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests-serveur
          path: backend/resultats-tests

  interface-build:
    name: Interface Angular (compilation de production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Build production application
        run: npm run build -- --configuration production --progress=false
      - name: Verify production build artifact
        run: test -s dist/pilotage-forfaits/index.html

  interface-tests:
    name: Interface Angular (tests unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Run Angular unit tests
        run: npm test

  reference:
    name: Données de référence (moteur de la version de référence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TODAY=2026-10-06 node outils/reference-poc/scenarios.cjs "$RUNNER_TEMP/reference"
      - run: |
          for f in "$RUNNER_TEMP"/reference/*.json; do
            diff -q "$f" "backend/tests/Donnees/$(basename "$f")"
          done
