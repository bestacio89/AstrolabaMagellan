# Validation miroir d'AstrolabaMagellan.
# Les trois jobs s'exécutent en parallèle, exclusivement sur les Pull Requests / Merge Requests.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - validation

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

serveur_dotnet:
  stage: validation
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends docker.io
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 2
      done
      docker info
  script:
    - cd backend
    - dotnet --info
    - dotnet restore PilotageForfaits.sln
    - dotnet build PilotageForfaits.sln --no-restore --configuration Release
    - dotnet test PilotageForfaits.sln --no-build --configuration Release --logger "trx;LogFileName=resultats.trx" --results-directory resultats-tests
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/resultats-tests/

interface_angular:
  stage: validation
  image: node:22
  cache:
    key:
      files:
        - frontend/package.json
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends chromium
  script:
    - cd frontend
    - npm install --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run build -- --configuration production
    - test -s dist/pilotage-forfaits/browser/index.html
    - export CHROME_BIN=/usr/bin/chromium
    - npm test -- --watch=false --browsers=ChromeHeadless
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/dist/

reference:
  stage: validation
  image: node:22
  script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp/reference"
    - TODAY=2026-10-06 node outils/reference-poc/scenarios.cjs "$CI_PROJECT_DIR/.tmp/reference"
    - |
      set -eu
      for f in "$CI_PROJECT_DIR"/.tmp/reference/*.json; do
        [ -f "$f" ] || continue
        diff -q "$f" "backend/tests/Donnees/$(basename "$f")"
      done
