# Validation miroir d'AstrolabaMagellan.
# Les trois jobs s'exécutent en parallèle, comme les jobs GitHub Actions.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - validation

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

serveur_dotnet:
  stage: validation
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - dotnet --info
    - docker info
  script:
    - cd backend
    - dotnet restore PilotageForfaits.sln
    - dotnet build PilotageForfaits.sln --no-restore --configuration Release
    - dotnet test PilotageForfaits.sln --no-build --configuration Release --logger "trx;LogFileName=resultats.trx" --results-directory resultats-tests
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/resultats-tests/

interface_angular:
  stage: validation
  image: node:22
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  script:
    - cd frontend
    - if [ -f package-lock.json ]; then npm ci --cache "$NPM_CONFIG_CACHE"; else npm install --cache "$NPM_CONFIG_CACHE"; fi
    - npm run build -- --configuration production
    - test -s dist/pilotage-forfaits/browser/index.html
    - npm test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/dist/

reference:
  stage: validation
  image: node:22
  script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp/reference"
    - TODAY=2026-10-06 node outils/reference-poc/scenarios.cjs "$CI_PROJECT_DIR/.tmp/reference"
    - |
      set -eu
      for f in "$CI_PROJECT_DIR"/.tmp/reference/*.json; do
        [ -f "$f" ] || continue
        diff -q "$f" "backend/tests/Donnees/$(basename "$f")"
      done
