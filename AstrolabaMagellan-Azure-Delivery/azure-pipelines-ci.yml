# Continuous integration only. This pipeline does not deploy resources or applications.
trigger: none
pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetSdkVersion: '10.0.x'
  nodeVersion: '22.x'

stages:
- stage: Validate
  displayName: Validate source and infrastructure
  jobs:
  - job: Backend
    displayName: Build and test .NET backend
    steps:
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetSdkVersion)
    - task: DotNetCoreCLI@2
      displayName: Restore solution
      inputs:
        command: restore
        projects: backend/PilotageForfaits.sln
    - task: DotNetCoreCLI@2
      displayName: Build solution
      inputs:
        command: build
        projects: backend/PilotageForfaits.sln
        arguments: '--configuration $(buildConfiguration) --no-restore'
    - task: DotNetCoreCLI@2
      displayName: Run tests
      inputs:
        command: test
        projects: backend/PilotageForfaits.sln
        arguments: '--configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=backend-tests.trx"'
        publishTestResults: true

  - job: Frontend
    displayName: Install, test and build Angular frontend
    steps:
    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: $(nodeVersion)
    - script: |
        set -euo pipefail
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      displayName: Install frontend dependencies
      workingDirectory: frontend
    # Angular test command depends on the repository's test runner. This common command
    # works with Angular CLI/Karma; adjust only if package.json uses a different runner.
    - script: npm run test -- --watch=false
      displayName: Run frontend tests
      workingDirectory: frontend
      continueOnError: false
    - script: npm run build -- --configuration production
      displayName: Build production frontend
      workingDirectory: frontend
    - task: PublishPipelineArtifact@1
      displayName: Publish frontend build output
      inputs:
        targetPath: frontend/dist
        artifact: frontend-dist
        publishLocation: pipeline

  - job: Infrastructure
    displayName: Validate Bicep and deployment scripts
    steps:
    - script: |
        set -euo pipefail
        for script in AstrolabaMagellan-Azure-Delivery/scripts/*.sh; do bash -n "$script"; done
        test -f AstrolabaMagellan-Azure-Delivery/infra/main.bicep
        test -f AstrolabaMagellan-Azure-Delivery/infra/parameters/test.bicepparam
        test -f AstrolabaMagellan-Azure-Delivery/infra/parameters/production.bicepparam
        grep -Fq 'scriptPath: AstrolabaMagellan-Azure-Delivery/scripts/deploy-application.sh' AstrolabaMagellan-Azure-Delivery/azure-pipelines-deploy.yml
        grep -Fq 'scriptPath: AstrolabaMagellan-Azure-Delivery/scripts/verify-private-networking.sh' AstrolabaMagellan-Azure-Delivery/azure-pipelines-deploy.yml
      displayName: Validate deployment scripts and paths
    - script: |
        set -euo pipefail
        az bicep build --file AstrolabaMagellan-Azure-Delivery/infra/main.bicep
      displayName: Build Bicep template
