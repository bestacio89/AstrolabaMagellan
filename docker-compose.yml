# Base de données PostgreSQL de DÉVELOPPEMENT.
# Démarrer : docker compose up -d     Arrêter : docker compose down
# Les identifiants ci-dessous sont réservés au développement local et ne doivent jamais être réutilisés ailleurs.
services:
  postgres:
    image: postgres:18
    container_name: pilotage-postgres
    environment:
      POSTGRES_DB: pilotage_forfaits
      POSTGRES_USER: pilotage
      POSTGRES_PASSWORD: pilotage_dev_local_only
    ports:
      - "5432:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotage -d pilotage_forfaits"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donnees-postgres:
